<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a1c">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../favicon.png">
<title>Slime Mode | Liquid Lab</title>
<style>
:root{color-scheme:dark;--bg:#0d1517;--panel:#1c2c28;--text:#edfff4;--lime:#91f3bb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overscroll-behavior-y:contain}
body{font:14px system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% -20%,#294339,#101b1c 58%,#0d1517 90%)}
a{color:inherit;text-decoration:none}button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #b9ffdc;outline-offset:3px}
main{max-width:710px;margin:auto;padding:12px 12px calc(22px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 13px}
.back{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#c8e1d3}
.back i{font-style:normal;display:grid;place-items:center;border:1px solid #456252;background:#243c31;border-radius:11px;width:36px;height:36px;font-size:18px}
.marker{font-size:10px;letter-spacing:.07em;font-weight:850;color:#b6eac6;border:1px solid #4a7259;background:#233b2e;padding:7px 11px;border-radius:99px}
h1{font-size:clamp(28px,7vw,37px);letter-spacing:-.05em;line-height:1.07;margin:0 0 6px}h1 span{color:#94f0bb}
.subtitle{font-size:12px;line-height:1.5;color:#a6c1b0;margin:0 0 13px}
.stage{position:relative;border-radius:20px;border:1px solid #48705a;background:#173331;overflow:hidden;box-shadow:0 18px 40px #020b0880}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:700/770;touch-action:none;user-select:none;-webkit-user-select:none}
.tip{position:absolute;top:10px;left:10px;right:10px;pointer-events:none;display:flex;justify-content:space-between;gap:8px}
.tip span{font-size:10px;font-weight:800;color:#daf9e6;border:1px solid #c0ffdc27;border-radius:9px;background:#0e251fce;padding:7px 9px}
.stage-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;color:#d8f9e7;border:1px solid #d0ffe028;border-radius:99px;background:#102721d9;padding:8px 12px;font-size:11px;font-weight:700}
.controls{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:8px;margin:11px 0}
.action{min-height:48px;background:#305a44;color:#edfff4;border:1px solid #52785f;border-radius:12px;font-size:12px;font-weight:800;padding:9px 6px}
.action.secondary{background:#21392e;border-color:#3c5847}.action.active{background:#39664e;border-color:#b1f3ca}
.action:active{transform:scale(.98)}
.palette-panel{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1b2b27;border:1px solid #3a5848;border-radius:14px;padding:9px 12px;margin:10px 0}
.palette-panel strong{font-size:12px;white-space:nowrap}
.palette{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.swatch{height:39px;width:39px;border:2px solid transparent;border-radius:11px;background:#293f33;display:grid;place-items:center}
.swatch i{width:22px;height:22px;display:block;background:var(--color);border-radius:50%;box-shadow:0 0 9px var(--color)}
.swatch.active{border-color:#e9fff2}.swatch[data-color=rainbow] i{background:conic-gradient(#f99,#fe9,#9f9,#8df,#baf,#f99)}
.panel{background:#182a25;border:1px solid #375546;border-radius:14px;margin:10px 0;overflow:hidden}
.panel summary{list-style:none;cursor:pointer;padding:15px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}
.panel summary::-webkit-details-marker{display:none}
.panel summary small{font-size:11px;color:#a4c3b2;font-weight:500}
.panel[open] summary .chevron{transform:rotate(180deg)}
.panel-body{padding:2px 15px 16px;border-top:1px solid #355142}
.range{margin:13px 0}.range:last-child{margin-bottom:0}
.label{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:8px}
.label output{color:#a0f4c0;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;min-height:24px;accent-color:#8dedb3}
.desktop-only{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#112121f2;padding:26px}
.desktop-only h2{font-size:24px;margin:5px 0}.desktop-only p{font-size:13px;color:#b4d0c1;line-height:1.55}
.desktop-only a{text-decoration:underline;color:#acffcc}
.footer{font-size:11px;color:#789682;text-align:center;margin:17px 0}
@media(max-width:500px){
 main{padding:9px 9px calc(16px + env(safe-area-inset-bottom))}
 header{margin-bottom:8px}h1{font-size:29px}.subtitle{font-size:11px;margin-bottom:10px}
 .stage{border-radius:15px}.stage canvas{aspect-ratio:700/850}
 .tip{top:7px;left:7px;right:7px}.tip span{font-size:9px;padding:6px 7px}
 .controls{margin:9px 0;gap:7px}.action{font-size:11px;min-height:45px}
 .palette-panel{padding:8px 10px}.palette-panel strong{font-size:11px}
 .palette{gap:5px}.swatch{width:35px;height:35px}.swatch i{width:21px;height:21px}
 .stage-hint{font-size:10px;padding:7px 10px}
}
@media(max-height:700px) and (max-width:500px){.stage canvas{aspect-ratio:700/760}.subtitle{display:none}}
@media(orientation:landscape) and (max-height:550px){.stage{max-width:min(76vh,480px);margin:auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

/* Embedded as the Slime tab inside Liquid Lab, never a second game page. */
html.embedded,html.embedded body{background:transparent}
html.embedded main{max-width:710px;padding:0;margin:0 auto}
html.embedded header,html.embedded h1,html.embedded .subtitle,html.embedded .footer,html.embedded #status{display:none}
html.embedded .stage{box-shadow:none;border-radius:15px}
html.embedded .stage canvas{aspect-ratio:700/770}
html.embedded .controls{margin-top:9px}
@media(max-width:500px){html.embedded .stage canvas{aspect-ratio:700/840}html.embedded .palette-panel{margin-top:8px}}
</style>
</head>
<body>
<main>
<header><a href="./" class="back"><i>←</i><span>LIQUID LAB</span></a><span class="marker">✌️ MOBILE-ONLY</span></header>
<h1>Slime <span>Mode.</span> 🟢</h1>

<section class="stage">
 <canvas id="slime" aria-label="Slime simulation with two-finger stretch."></canvas>
 <div class="tip"><span id="status">● SOFT BODY LIVE</span><span id="grabs">✋ TOUCH TO GRAB</span></div>
 <span class="stage-hint" id="hint">☝️ Drag to move · ✌️ Stretch</span>
 <div class="desktop-only" id="desktop"><div style="font-size:46px">📱</div><h2>Touchscreen only!</h2><p>Slime Mode is made for phones and tablets with two-finger controls.</p><a href="./">Back to Liquid Lab</a></div>
</section>
<div class="controls"><button class="action" id="squish">💥 Squish</button><button class="action secondary" id="reset">↺ New blob</button><button class="action active" id="effects" aria-pressed="true">✨ FX ON</button></div>
<section class="palette-panel"><strong>🎨 Color</strong><div class="palette">
<button class="swatch active" data-color="mint" aria-label="Mint" style="--color:#81f1b3"><i></i></button>
<button class="swatch" data-color="pink" aria-label="Pink" style="--color:#ff9bc9"><i></i></button>
<button class="swatch" data-color="violet" aria-label="Violet" style="--color:#ac9bff"><i></i></button>
<button class="swatch" data-color="blue" aria-label="Blue" style="--color:#82cfff"><i></i></button>
<button class="swatch" data-color="rainbow" aria-label="Rainbow" style="--color:#caf6d0"><i></i></button>
</div></section>
<details class="panel" id="tuning"><summary><span>⚙️ Physics <small>· Stretch, thickness, gravity</small></span><span class="chevron">⌄</span></summary><div class="panel-body">
<div class="range"><div class="label"><label for="elastic">Stretchiness</label><output id="elastic-val">70%</output></div><input id="elastic" type="range" min="10" max="100" value="70"></div>
<div class="range"><div class="label"><label for="viscous">Thickness</label><output id="viscous-val">70%</output></div><input id="viscous" type="range" min="5" max="100" value="70"></div>
<div class="range"><div class="label"><label for="gravity">Gravity</label><output id="gravity-val">25%</output></div><input id="gravity" type="range" min="0" max="100" value="25"></div>
</div></details>

</main>
<script>
(()=>{
"use strict";
const embedded=/(?:^|[?&])embed=1(?:&|$)/.test(window.location.search);
if(!embedded){window.location.replace("./#slime");return}
document.documentElement.classList.add("embedded");
const $=s=>document.querySelector(s),canvas=$("#slime"),g=canvas.getContext("2d",{alpha:false});
const W=700,H=770,TAU=Math.PI*2,N=40,FLOOR=H-57;
const palette={mint:[129,241,179],pink:[255,155,201],violet:[172,155,255],blue:[130,207,255]};
const mobile=(navigator.maxTouchPoints>=2)||(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches);
if(!mobile){$("#desktop").style.display="flex";$("#status").textContent="MOBILE ONLY"}
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
let color="mint",stretch=.7,thickness=.7,gravity=.25,fx=true,phase=0;
let bodies=[],touches=new Map(),sparks=[],ripples=[],tearLines=[],serial=0,last=0,accumulator=0,running=true,tearNotice=0,tearFlash=0,shakeFrames=0,stressGlow=0;
function resize(){
 const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.65);
 if(!box.width||!box.height)return;
 const w=Math.round(box.width*dpr),h=Math.round(box.height*dpr);
 if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
}
resize();
window.addEventListener("resize",resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas.parentElement||canvas);
function makeBody(cx,cy,rx=124,ry=94,vx=0,vy=0){
 const b={id:++serial,nodes:[],restArea:Math.PI*rx*ry,rad:Math.sqrt(rx*ry),age:0};
 for(let i=0;i<N;i++){
  const a=i*TAU/N;
  const x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);
  b.nodes.push({x,y,px:x,py:y,vx:vx+(Math.random()-.5)*.25,vy:vy+(Math.random()-.5)*.25});
 }
 return b;
}
function reset(){
 touches.clear();sparks=[];ripples=[];tearLines=[];tearNotice=0;tearFlash=0;shakeFrames=0;stressGlow=0;
 bodies=[makeBody(W*.5,H*.54)];
 $("#grabs").textContent="✋ TOUCH TO GRAB";
 $("#hint").textContent="☝️ Drag to move · ✌️ Stretch";
}
reset();
function centroid(b){
 let x=0,y=0;
 for(const p of b.nodes){x+=p.x;y+=p.y}
 return{x:x/b.nodes.length,y:y/b.nodes.length};
}
function area(b){
 let sum=0,points=b.nodes;
 for(let i=0;i<points.length;i++){
  const p=points[i],q=points[(i+1)%points.length];
  sum+=p.x*q.y-q.x*p.y;
 }
 return sum*.5;
}
function circleDistance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearestNode(b,x,y,except){
 let best=null,d=Infinity;
 for(const p of b.nodes){
  if(p===except)continue;
  const t=Math.hypot(p.x-x,p.y-y);
  if(t<d){d=t;best=p}
 }
 return{node:best,d};
}
function findBody(x,y){
 let result=null,d=Infinity;
 for(const b of bodies){
  const c=centroid(b),near=nearestNode(b,x,y);
  const score=Math.min(near.d,Math.hypot(c.x-x,c.y-y)*.8);
  if(score<d){d=score;result=b}
 }
 return d<175?result:null;
}
function sparkle(x,y,count=14,speed=1){
 if(!fx)return;
 ripples.push({x,y,r:12,life:1});
 if(ripples.length>13)ripples.shift();
 for(let i=0;i<count;i++){
  const a=Math.random()*TAU,v=(1.5+Math.random()*4.5)*speed;
  sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:1,rad:1.1+Math.random()*3});
 }
 if(sparks.length>150)sparks.splice(0,sparks.length-150);
}
function coords(e){
 const r=canvas.getBoundingClientRect();
 return{x:clamp((e.clientX-r.left)/r.width*W,12,W-12),y:clamp((e.clientY-r.top)/r.height*H,12,H-12)};
}
function down(e){
 if(!mobile||touches.size>=2)return;
 e.preventDefault();
 const {x,y}=coords(e);
 const body=findBody(x,y);if(!body)return;
 canvas.setPointerCapture(e.pointerId);
 const existing=[...touches.values()].find(t=>t.body===body);
 let node=nearestNode(body,x,y,existing&&existing.node).node;
 if(existing&&circleDistance(node,existing.node)<38){
  const i=body.nodes.indexOf(existing.node);
  node=body.nodes[(i+Math.floor(N/2))%N];
 }
 touches.set(e.pointerId,{body,node,x,y,dx:0,dy:0,ox:x,oy:y,offsetX:node.x-x,offsetY:node.y-y,held:0});
 $("#grabs").textContent=touches.size===2?"✌️ STRETCHING":"☝️ GRABBED";
 $("#hint").textContent=touches.size===2?"Pull harder to tear it!":"Drag the slime";
 sparkle(x,y,5,.6);
}
function move(e){
 const t=touches.get(e.pointerId);
 if(!t)return;
 e.preventDefault();
 const p=coords(e);
 t.dx=clamp(p.x-t.x,-40,40);t.dy=clamp(p.y-t.y,-40,40);
 t.x=p.x;t.y=p.y;
}
function up(e){
 const t=touches.get(e.pointerId);if(!t)return;
 touches.delete(e.pointerId);
 t.node.vx+=t.dx*.38;t.node.vy+=t.dy*.38;
 sparkle(t.x,t.y,9,.6);
 $("#grabs").textContent=touches.size?"☝️ GRABBED":"✋ TOUCH TO GRAB";
 $("#hint").textContent=touches.size?"Drag the slime":"☝️ Drag to move · ✌️ Stretch";
}
canvas.addEventListener("pointerdown",down);
canvas.addEventListener("pointermove",move);
canvas.addEventListener("pointerup",up);
canvas.addEventListener("pointercancel",up);
canvas.addEventListener("lostpointercapture",up);
function pinned(p){
 for(const t of touches.values())if(t.node===p)return t;
 return null;
}
function keepPinned(){
 for(const t of touches.values()){
  t.node.x=t.x+t.offsetX;t.node.y=t.y+t.offsetY;
 }
}
function spring(a,b,rest,strength){
 const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001;
 const gap=(d-rest)/d*strength;
 const ax=dx*gap,ay=dy*gap;
 const pa=pinned(a),pb=pinned(b);
 if(!pa&&!pb){a.x+=ax*.5;a.y+=ay*.5;b.x-=ax*.5;b.y-=ay*.5}
 else if(pa&&!pb){b.x-=ax;b.y-=ay}
 else if(!pa&&pb){a.x+=ax;a.y+=ay}
}
function constrainBody(b){
 const ns=b.nodes,count=ns.length;
 const edgeRest=2*Math.sin(Math.PI/count)*b.rad;
 const damp=.92-thickness*.12;
 for(const p of ns){
  p.px=p.x;p.py=p.y;
  if(pinned(p))continue;
  p.vx=clamp(p.vx*damp,-21,21);
  p.vy=clamp((p.vy+(.07+gravity*.37))*damp,-21,21);
  p.x+=p.vx;p.y+=p.vy;
 }
 // Real freely moving perimeter particles, unlike the old fixed ellipse.
 // Sorting around the centroid preserves a simple surface after strong pulls.
 for(let iter=0;iter<5;iter++){
  keepPinned();
  const c=centroid(b);
  ns.sort((a,q)=>Math.atan2(a.y-c.y,a.x-c.x)-Math.atan2(q.y-c.y,q.x-c.x));
  const compliance=.29-stretch*.085;
  for(let i=0;i<count;i++){
   spring(ns[i],ns[(i+1)%count],edgeRest,compliance);
   spring(ns[i],ns[(i+2)%count],edgeRest*2,.085-stretch*.026);
  }
  // Elastic volume pressure. No node can pass through the middle.
  const cc=centroid(b);
  for(const p of ns){
   if(pinned(p))continue;
   const dx=p.x-cc.x,dy=p.y-cc.y,d=Math.hypot(dx,dy)||.001;
   const minRadius=b.rad*.21;
   if(d<minRadius){p.x+=dx/d*(minRadius-d);p.y+=dy/d*(minRadius-d)}
  }
  const current=Math.abs(area(b));
  const minArea=b.restArea*.55;
  const maxArea=b.restArea*1.65;
  if(current<minArea||current>maxArea){
   const scale=clamp(Math.sqrt((current<minArea?minArea:maxArea)/Math.max(current,1)),.94,1.09);
   for(const p of ns){
    if(pinned(p))continue;
    p.x=cc.x+(p.x-cc.x)*scale;
    p.y=cc.y+(p.y-cc.y)*scale;
   }
  }
  for(const p of ns){
   if(pinned(p))continue;
   p.x=clamp(p.x,12,W-12);
   p.y=clamp(p.y,28,FLOOR);
  }
 }
 keepPinned();
 const cc=centroid(b);
 ns.sort((a,q)=>Math.atan2(a.y-cc.y,a.x-cc.x)-Math.atan2(q.y-cc.y,q.x-cc.x));
 for(const p of ns){
  const touch=pinned(p);
  if(touch){p.vx=touch.dx*.6;p.vy=touch.dy*.6;continue}
  p.vx=clamp((p.x-p.px)*damp,-17,17);
  p.vy=clamp((p.y-p.py)*damp,-17,17);
 }
 b.age++;
}
function splitBody(body,t1,t2){
 // Tear the mesh and replace it with two independently simulated soft bodies.
 if(bodies.length>=4)return;
 const midpoint={x:(t1.x+t2.x)/2,y:(t1.y+t2.y)/2};
 const r=body.rad*.78;
 const dx=t2.x-t1.x,dy=t2.y-t1.y,len=Math.hypot(dx,dy)||1;
 const offset=Math.min(55,len*.16);
 const c1x=clamp(t1.x+dx/len*offset,105,W-105),c1y=clamp(t1.y+dy/len*offset,118,FLOOR-110);
 const c2x=clamp(t2.x-dx/len*offset,105,W-105),c2y=clamp(t2.y-dy/len*offset,118,FLOOR-110);
 const a=makeBody(c1x,c1y,r*.99,r*.94,t1.dx*.28-dx/len*1.2,t1.dy*.28-dy/len*1.2);
 const b=makeBody(c2x,c2y,r*.99,r*.94,t2.dx*.28+dx/len*1.2,t2.dy*.28+dy/len*1.2);
 bodies=bodies.filter(p=>p!==body);
 bodies.push(a,b);
 t1.body=a;t1.node=nearestNode(a,t1.x,t1.y).node;
 t2.body=b;t2.node=nearestNode(b,t2.x,t2.y).node;
 t1.offsetX=0;t1.offsetY=0;t2.offsetX=0;t2.offsetY=0;
 t1.node.x=t1.x;t1.node.y=t1.y;
 t2.node.x=t2.x;t2.node.y=t2.y;
 tearLines.push({x1:t1.x,y1:t1.y,x2:t2.x,y2:t2.y,life:1});
 tearFlash=1;shakeFrames=23;stressGlow=0;
 sparkle(midpoint.x,midpoint.y,75,2.25);
 sparkle(t1.x,t1.y,22,1.5);
 sparkle(t2.x,t2.y,22,1.5);
 for(let k=0;k<13;k++){
  const r=18+k*10;
  ripples.push({x:midpoint.x,y:midpoint.y,r,life:1-k*.042});
 }
 if(ripples.length>24)ripples.splice(0,ripples.length-24);
 $("#grabs").textContent="💥 SNAPPED IN TWO!";
 $("#hint").textContent="Two slimes! Keep pulling!";
 tearNotice=115;
}
function maybeSplit(){
 const grabbed=[...touches.values()];
 if(grabbed.length!==2||grabbed[0].body!==grabbed[1].body)return;
 const a=grabbed[0],b=grabbed[1],dist=Math.hypot(a.x-b.x,a.y-b.y);
 const threshold=445+stretch*145;
 const totalPull=Math.hypot(a.x-a.ox,a.y-a.oy)+Math.hypot(b.x-b.ox,b.y-b.oy);
 stressGlow=clamp((dist-threshold*.55)/(threshold*.45),0,1);
 if(dist>threshold&&totalPull>250){
  a.held++;b.held++;
  if(a.held>=11)splitBody(a.body,a,b);
 }else{a.held=0;b.held=0}
}
function step(){
 phase+=1/60;
 maybeSplit();
 if(tearFlash>0)tearFlash=Math.max(0,tearFlash-.055);
 if(shakeFrames>0)shakeFrames--;
 if(touches.size<2)stressGlow*=.82;
 for(const b of bodies)constrainBody(b);
 for(let i=sparks.length-1;i>=0;i--){
  const p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.10;p.vx*=.985;p.life-=.024;
  if(p.life<=0)sparks.splice(i,1);
 }
 for(let i=ripples.length-1;i>=0;i--){const p=ripples[i];p.r+=3.5;p.life-=.034;if(p.life<=0)ripples.splice(i,1)}
 for(let i=tearLines.length-1;i>=0;i--){const p=tearLines[i];p.life-=.032;if(p.life<=0)tearLines.splice(i,1)}
 if(tearNotice>0&&--tearNotice===0){
  $("#grabs").textContent=touches.size?"✌️ STRETCHING":"✋ TOUCH TO GRAB";
  $("#hint").textContent="☝️ Drag to move · ✌️ Stretch";
 }
}
const backgroundCanvas=document.createElement("canvas");
backgroundCanvas.width=W;backgroundCanvas.height=H;
const bg=backgroundCanvas.getContext("2d");
function paintBackground(){
 const grad=bg.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,"#173632");grad.addColorStop(1,"#142729");
 bg.fillStyle=grad;bg.fillRect(0,0,W,H);
 bg.strokeStyle="#d9fff00a";bg.lineWidth=1;bg.beginPath();
 for(let x=0;x<W;x+=46){bg.moveTo(x,0);bg.lineTo(x,H)}
 for(let y=0;y<H;y+=46){bg.moveTo(0,y);bg.lineTo(W,y)}
 bg.stroke();
 const halo=bg.createRadialGradient(340,330,50,340,330,370);
 halo.addColorStop(0,"#86eeaf20");halo.addColorStop(1,"#86eeaf00");
 bg.fillStyle=halo;bg.fillRect(0,0,W,H);
 bg.fillStyle="#213937";bg.fillRect(0,FLOOR+6,W,H-FLOOR);
 bg.beginPath();bg.moveTo(0,FLOOR+5);bg.lineTo(W,FLOOR+5);
 bg.strokeStyle="#a6efd13a";bg.lineWidth=2;bg.stroke();
}
paintBackground();
function outline(ns){
 const a=ns[ns.length-1],b=ns[0];
 g.beginPath();g.moveTo((a.x+b.x)*.5,(a.y+b.y)*.5);
 for(let i=0;i<ns.length;i++){
  const p=ns[i],q=ns[(i+1)%ns.length];
  g.quadraticCurveTo(p.x,p.y,(p.x+q.x)*.5,(p.y+q.y)*.5);
 }
 g.closePath();
}
function drawBody(b){
 const ns=b.nodes,c=centroid(b),rgb=palette[color]||[150,235,198];
 let maxD=1;
 for(const p of ns)maxD=Math.max(maxD,Math.hypot(p.x-c.x,p.y-c.y));
 g.save();
 g.fillStyle="#001c1970";g.beginPath();g.ellipse(c.x,FLOOR+10,Math.min(185,maxD*.65+18),14,0,0,TAU);g.fill();
 g.restore();
 g.save();
 outline(ns);
 if(fx){g.shadowColor="rgba("+rgb.join(",")+",.39)";g.shadowBlur=17}
 let grad;
 if(color==="rainbow"){
  grad=g.createLinearGradient(c.x-maxD,c.y-maxD*.5,c.x+maxD,c.y+maxD*.6);
  for(let i=0;i<6;i++)grad.addColorStop(i/5,"hsl("+((phase*33+i*71)%360)+",93%,75%)");
 }else{
  grad=g.createRadialGradient(c.x-maxD*.3,c.y-maxD*.35,3,c.x,c.y,maxD*1.35);
  grad.addColorStop(0,"rgb("+Math.min(255,rgb[0]+45)+","+Math.min(255,rgb[1]+16)+","+Math.min(255,rgb[2]+29)+")");
  grad.addColorStop(.55,"rgb("+rgb.join(",")+")");
  grad.addColorStop(1,"rgb("+Math.round(rgb[0]*.69)+","+Math.round(rgb[1]*.77)+","+Math.round(rgb[2]*.72)+")");
 }
 g.fillStyle=grad;g.fill();
 g.shadowBlur=0;g.lineWidth=3;g.strokeStyle="#ebfff1ac";g.stroke();g.clip();
 if(fx){
  for(let i=0;i<10;i++){
   const theta=i*2.39+phase*.09,rad=(.14+.06*i)*b.rad;
   const px=c.x+Math.cos(theta)*rad,py=c.y+Math.sin(theta)*rad;
   const r=3+(i%3)*2;
   g.fillStyle="#fff9";g.globalAlpha=.18;g.beginPath();g.arc(px,py,r,0,TAU);g.fill();
   g.globalAlpha=.7;g.strokeStyle="#f4fff5b3";g.lineWidth=1;
   g.beginPath();g.arc(px,py,r,Math.PI*1.05,Math.PI*1.8);g.stroke();
  }
  g.globalAlpha=1;
  const gloss=g.createRadialGradient(c.x-maxD*.38,c.y-maxD*.45,2,c.x-maxD*.38,c.y-maxD*.45,maxD*.82);
  gloss.addColorStop(0,"#ffffff72");gloss.addColorStop(1,"#ffffff00");
  g.fillStyle=gloss;g.fillRect(c.x-maxD,c.y-maxD,maxD*2,maxD*2);
  // A face rides on the moving centroid, not a fixed ellipse.
  g.fillStyle="#245143dd";g.strokeStyle="#245143dd";g.lineWidth=2.5;
  const eyeSpace=Math.min(23,b.rad*.18),blink=Math.sin(phase*1.4+b.id)>.996;
  for(const sign of [-1,1]){
   if(blink){g.beginPath();g.moveTo(c.x+sign*eyeSpace-4,c.y-5);g.lineTo(c.x+sign*eyeSpace+4,c.y-5);g.stroke()}
   else{g.beginPath();g.ellipse(c.x+sign*eyeSpace,c.y-5,3,4,0,0,TAU);g.fill()}
  }
  g.beginPath();g.arc(c.x,c.y+6,9,.18*Math.PI,.82*Math.PI);g.stroke();
 }
 g.restore();
}
function draw(){
 g.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
 g.save();
 if(shakeFrames>0){
  const intensity=(shakeFrames/23)*5;
  g.translate((Math.random()-.5)*intensity*2,(Math.random()-.5)*intensity*2);
 }
 g.drawImage(backgroundCanvas,0,0,W,H);
 for(const b of bodies)drawBody(b);
 if(fx){
  for(const p of tearLines){
   g.save();
   const midX=(p.x1+p.x2)*.5,midY=(p.y1+p.y2)*.5;
   g.strokeStyle="rgba(226,255,237,"+p.life*.90+")";g.lineWidth=6*p.life+1;
   g.shadowBlur=18;g.shadowColor="#8bffd2";
   g.beginPath();g.moveTo(p.x1,p.y1);
   g.quadraticCurveTo(midX+Math.sin(phase*19)*20,midY+Math.cos(phase*15)*23,p.x2,p.y2);
   g.stroke();g.restore();
  }
  for(const p of ripples){
   g.strokeStyle="rgba(229,255,242,"+p.life*.6+")";g.lineWidth=2;
   g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.stroke();
  }
  for(const p of sparks){
   g.fillStyle="rgba(242,255,246,"+p.life*.9+")";
   const r=p.rad;g.beginPath();g.moveTo(p.x,p.y-r*1.8);
   g.lineTo(p.x+r*.6,p.y);g.lineTo(p.x,p.y+r*1.8);g.lineTo(p.x-r*.6,p.y);g.closePath();g.fill();
  }
 }
 const grabbed=[...touches.values()];
 if(grabbed.length===2&&grabbed[0].body===grabbed[1].body){
  const a=grabbed[0],b=grabbed[1];
  const d=Math.hypot(a.x-b.x,a.y-b.y),threshold=445+stretch*145;
  const pressure=clamp(d/threshold,0,1.2);
  // Tension strands become increasingly bright and jagged near rupture.
  if(fx&&pressure>.68){
   const mx=(a.x+b.x)*.5,my=(a.y+b.y)*.5;
   g.save();
   g.shadowColor="#baffdd";g.shadowBlur=12+stressGlow*25;
   for(let k=-1;k<=1;k++){
    const offset=k*(7+stressGlow*7);
    g.strokeStyle="rgba(225,255,237,"+(.18+stressGlow*.36)+")";
    g.lineWidth=1+stressGlow*2.5;
    g.beginPath();g.moveTo(a.x,a.y);
    g.quadraticCurveTo(mx+Math.sin(phase*14+k*2)*18,my+offset,b.x,b.y);
    g.stroke();
   }
   g.restore();
  }
  g.strokeStyle="rgba(219,255,236,"+(pressure*.23)+")";
  g.lineWidth=1.8;g.setLineDash([8,8]);
  g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.setLineDash([]);
 }
 if(tearFlash>0&&fx){
  g.fillStyle="rgba(237,255,243,"+Math.pow(tearFlash,2)*.34+")";
  g.fillRect(0,0,W,H);
 }
 for(const t of grabbed){
  g.strokeStyle="#eefff4c4";g.lineWidth=2;
  g.beginPath();g.arc(t.x,t.y,14+Math.sin(phase*6)*2,0,TAU);g.stroke();
  g.fillStyle="#fff9";g.beginPath();g.arc(t.x,t.y,3.5,0,TAU);g.fill();
 }
 g.restore();
}
function frame(time){
 if(!running)return;
 const dt=last?Math.min(50,time-last):16.667;last=time;
 accumulator=Math.min(55,accumulator+dt);
 let count=0;
 while(accumulator>=16.667&&count<3){step();accumulator-=16.667;count++}
 draw();
 requestAnimationFrame(frame);
}
function notifyHeight(){
 if(!embedded)return;
 const main=document.querySelector("main");
 if(!main)return;
 window.parent.postMessage({type:"liquid-lab:slime-height",height:Math.ceil(main.scrollHeight+3)},window.location.origin);
}
window.addEventListener("message",event=>{
 if(event.origin!==window.location.origin)return;
 const data=event.data;
 if(!data||data.type!=="liquid-lab:slime-active")return;
 if(!data.active)running=false;
 else if(!running){running=true;last=0;accumulator=0;requestAnimationFrame(frame)}
});
if(window.ResizeObserver)new ResizeObserver(notifyHeight).observe(document.querySelector("main"));
requestAnimationFrame(notifyHeight);
if(mobile)requestAnimationFrame(frame);
$("#reset").addEventListener("click",()=>{reset();sparkle(W*.5,H*.54,17,.8)});
$("#squish").addEventListener("click",()=>{
 for(const b of bodies)for(const p of b.nodes){p.vy-=3.8;p.vx+=(p.x-W/2)*.016}
 sparkle(W*.5,H*.5,18,1);
 $("#hint").textContent="BOING! 🫧";
});
$("#effects").addEventListener("click",()=>{
 fx=!fx;
 $("#effects").textContent=fx?"✨ FX ON":"✨ FX OFF";
 $("#effects").classList.toggle("active",fx);
 $("#effects").setAttribute("aria-pressed",String(fx));
 if(!fx){ripples.length=0;sparks.length=0;tearLines.length=0}
});
for(const id of ["elastic","viscous","gravity"]){
 $("#"+id).addEventListener("input",e=>{
  const n=Number(e.target.value);
  $("#"+id+"-val").textContent=n+"%";
  if(id==="elastic")stretch=n/100;
  if(id==="viscous")thickness=n/100;
  if(id==="gravity")gravity=n/100;
 });
}
document.querySelectorAll(".swatch").forEach(b=>b.addEventListener("click",()=>{
 color=b.dataset.color;
 document.querySelectorAll(".swatch").forEach(e=>e.classList.toggle("active",e===b));
 sparkle(W*.5,H*.5,8,.5);
}));
})();
</script>
</body>
</html>
