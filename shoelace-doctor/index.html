<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Shoelace Doctor</title><style>body{background:#10182b;color:#f5f7ff;font-family:system-ui;margin:0}main{max-width:520px;margin:auto;padding:16px}.panel{background:#1b2942;border:1px solid #354666;border-radius:18px;padding:15px;margin:12px 0}.top{display:flex;justify-content:space-between}.shoe{height:250px;background:radial-gradient(circle,#3a506d,#18283e);border-radius:12px;touch-action:manipulation}.shoe svg{width:100%;height:100%}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.btn{border:1px solid #526a8c;background:#30486b;color:white;border-radius:12px;min-height:48px;font-size:15px;padding:9px}.selected{background:#446cc5!important;border-color:#b2caff}.primary{background:#4c77e6;width:100%;margin-top:10px}.btn:disabled{opacity:.4}.notice{min-height:45px;line-height:1.5}.meter{height:9px;background:#101c31;border-radius:10px;overflow:hidden;margin:8px 0}.fill{height:100%;background:#6ce1b4;width:0;transition:width .2s}.hidden{display:none}.sub{color:#b4c5e4;font-size:13px}</style><main><h1>👟 Shoelace Doctor</h1><p class="sub">Emergency footwear clinic · Examine · Diagnose · Treat</p><div class="panel"><div class="top"><b id="patient">Patient #1</b><b id="score">⭐ 0 points</b></div><div class="meter"><div class="fill" id="progress"></div></div><small id="status">Inspection 0/3</small></div><div class="panel"><div class="shoe" id="shoe"><svg viewBox="0 0 360 280"><ellipse cx="185" cy="235" rx="140" ry="21" fill="#0c1726"/><path d="M42 188 Q60 140 110 140 L158 75 Q175 57 207 84 L255 157 Q298 169 315 195 L315 222 Q178 242 43 219Z" fill="#f0f4ff" stroke="#94a8c9" stroke-width="5"/><path d="M48 210 Q170 233 313 211 L313 227 Q173 251 45 228Z" fill="#f5ad62"/><path d="M160 80 Q193 94 222 146 L175 185 L110 142Z" fill="#5a80b9"/><path d="M120 150 L194 102 M132 163 L204 117 M144 176 L216 132 M156 189 L228 147" stroke="#ffdc8e" stroke-width="6" stroke-linecap="round"/><path d="M176 185 Q220 206 252 178 Q274 144 290 174 Q281 196 251 178 Q230 154 215 173 Q221 193 251 178" fill="none" stroke="#ffdc8e" stroke-width="6" stroke-linecap="round"/></svg></div><p class="notice" id="notice">Choose a tool, then tap the shoe.</p></div><div class="panel"><h3>1. Examine</h3><div class="controls" id="tools"><button class="btn selected" data-tool="Look">🔎 Look</button><button class="btn" data-tool="Tug">🪢 Tug test</button><button class="btn" data-tool="Flex">🦶 Flex test</button></div></div><div class="panel"><h3>2. Diagnose</h3><div class="controls" id="diagnoses"><button class="btn" data-dx="frayed">Frayed lace</button><button class="btn" data-dx="loose">Loose knot</button><button class="btn" data-dx="twisted">Twisted lace</button><button class="btn" data-dx="short">Too short</button></div><button class="btn primary" id="treat" disabled>🩹 Treat patient</button><p id="outcome"></p></div><button class="btn primary hidden" id="next">Next patient →</button></main><script>const $=s=>document.querySelector(s);let score=0,num=1,problem,checks=new Set(),tool='Look',dx=null,finished=false;const cases={frayed:{Look:'The lace tip looks fuzzy and shredded.',Tug:'Fibers separate when you gently pull.',Flex:'The lace snags against an eyelet.',fix:'Trim the damaged tip and fit a new aglet.'},loose:{Look:'The bow is uneven and floppy.',Tug:'The knot slips apart with barely any force.',Flex:'The bow loosens as the shoe bends.',fix:'Retie with a secure double knot.'},twisted:{Look:'The lace crosses itself in a strange spiral.',Tug:'It feels tight in one spot and loose in another.',Flex:'The tongue bunches up when the shoe bends.',fix:'Unthread and relace it without twists.'},short:{Look:'The bow loops are tiny and barely reach.',Tug:'There is almost no spare lace to pull.',Flex:'The knot strains when the shoe bends.',fix:'Replace it with a longer shoelace.'}};function update(){$('#score').textContent='⭐ '+score+' points';$('#patient').textContent='Patient #'+num;$('#progress').style.width=checks.size/3*100+'%';$('#status').textContent='Inspection '+checks.size+'/3';$('#treat').disabled=checks.size!==3||!dx||finished}function newCase(){problem=Object.keys(cases)[Math.floor(Math.random()*4)];checks=new Set();dx=null;finished=false;tool='Look';$('#outcome').textContent='';$('#next').classList.add('hidden');document.querySelectorAll('[data-dx]').forEach(b=>b.classList.remove('selected'));document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('selected',b.dataset.tool===tool));$('#notice').textContent='New patient! Choose a tool and tap the shoe.';update()}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('selected',x===b));if(!finished)$('#notice').textContent='Tap the shoe to perform: '+tool});$('#shoe').addEventListener('pointerdown',()=>{if(finished)return;checks.add(tool);$('#notice').textContent='🩺 '+tool+': '+cases[problem][tool];update()});document.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{if(finished)return;dx=b.dataset.dx;document.querySelectorAll('[data-dx]').forEach(x=>x.classList.toggle('selected',x===b));update()});$('#treat').onclick=()=>{if(finished||checks.size<3||!dx)return;finished=true;let correct=dx===problem;score+=correct?100:-25;$('#outcome').textContent=(correct?'✅ Correct! +100 points. ':'❌ Wrong diagnosis! −25 points. Actual issue: '+problem+'. ')+'Treatment: '+cases[problem].fix;$('#notice').textContent=correct?'Patient successfully treated!':'The patient is okay, but your diagnosis was off.';$('#next').classList.remove('hidden');update()};$('#next').onclick=()=>{num++;newCase()};newCase();</script></html>
