<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a1c">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../favicon.png">
<title>Slime Mode | Liquid Lab</title>
<style>
:root{color-scheme:dark;--bg:#0d1517;--panel:#1c2c28;--text:#edfff4;--lime:#91f3bb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overscroll-behavior-y:contain}
body{font:14px system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% -20%,#294339,#101b1c 58%,#0d1517 90%)}
a{color:inherit;text-decoration:none}button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #b9ffdc;outline-offset:3px}
main{max-width:710px;margin:auto;padding:12px 12px calc(22px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 13px}
.back{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#c8e1d3}
.back i{font-style:normal;display:grid;place-items:center;border:1px solid #456252;background:#243c31;border-radius:11px;width:36px;height:36px;font-size:18px}
.marker{font-size:10px;letter-spacing:.07em;font-weight:850;color:#b6eac6;border:1px solid #4a7259;background:#233b2e;padding:7px 11px;border-radius:99px}
h1{font-size:clamp(28px,7vw,37px);letter-spacing:-.05em;line-height:1.07;margin:0 0 6px}h1 span{color:#94f0bb}
.subtitle{font-size:12px;line-height:1.5;color:#a6c1b0;margin:0 0 13px}
.stage{position:relative;border-radius:20px;border:1px solid #48705a;background:#173331;overflow:hidden;box-shadow:0 18px 40px #020b0880}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:700/770;touch-action:none;user-select:none;-webkit-user-select:none}
.tip{position:absolute;top:10px;left:10px;right:10px;pointer-events:none;display:flex;justify-content:space-between;gap:8px}
.tip span{font-size:10px;font-weight:800;color:#daf9e6;border:1px solid #c0ffdc27;border-radius:9px;background:#0e251fce;padding:7px 9px}
.stage-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;color:#d8f9e7;border:1px solid #d0ffe028;border-radius:99px;background:#102721d9;padding:8px 12px;font-size:11px;font-weight:700}
.controls{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:8px;margin:11px 0}
.action{min-height:48px;background:#305a44;color:#edfff4;border:1px solid #52785f;border-radius:12px;font-size:12px;font-weight:800;padding:9px 6px}
.action.secondary{background:#21392e;border-color:#3c5847}.action.active{background:#39664e;border-color:#b1f3ca}
.action:active{transform:scale(.98)}
.palette-panel{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1b2b27;border:1px solid #3a5848;border-radius:14px;padding:9px 12px;margin:10px 0}
.palette-panel strong{font-size:12px;white-space:nowrap}
.palette{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.swatch{height:39px;width:39px;border:2px solid transparent;border-radius:11px;background:#293f33;display:grid;place-items:center}
.swatch i{width:22px;height:22px;display:block;background:var(--color);border-radius:50%;box-shadow:0 0 9px var(--color)}
.swatch.active{border-color:#e9fff2}.swatch[data-color=rainbow] i{background:conic-gradient(#f99,#fe9,#9f9,#8df,#baf,#f99)}
.panel{background:#182a25;border:1px solid #375546;border-radius:14px;margin:10px 0;overflow:hidden}
.panel summary{list-style:none;cursor:pointer;padding:15px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800}
.panel summary::-webkit-details-marker{display:none}
.panel summary small{font-size:11px;color:#a4c3b2;font-weight:500}
.panel[open] summary .chevron{transform:rotate(180deg)}
.panel-body{padding:2px 15px 16px;border-top:1px solid #355142}
.range{margin:13px 0}.range:last-child{margin-bottom:0}
.label{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:8px}
.label output{color:#a0f4c0;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;min-height:24px;accent-color:#8dedb3}
.desktop-only{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#112121f2;padding:26px}
.desktop-only h2{font-size:24px;margin:5px 0}.desktop-only p{font-size:13px;color:#b4d0c1;line-height:1.55}
.desktop-only a{text-decoration:underline;color:#acffcc}
.footer{font-size:11px;color:#789682;text-align:center;margin:17px 0}
@media(max-width:500px){
 main{padding:9px 9px calc(16px + env(safe-area-inset-bottom))}
 header{margin-bottom:8px}h1{font-size:29px}.subtitle{font-size:11px;margin-bottom:10px}
 .stage{border-radius:15px}.stage canvas{aspect-ratio:700/850}
 .tip{top:7px;left:7px;right:7px}.tip span{font-size:9px;padding:6px 7px}
 .controls{margin:9px 0;gap:7px}.action{font-size:11px;min-height:45px}
 .palette-panel{padding:8px 10px}.palette-panel strong{font-size:11px}
 .palette{gap:5px}.swatch{width:35px;height:35px}.swatch i{width:21px;height:21px}
 .stage-hint{font-size:10px;padding:7px 10px}
}
@media(max-height:700px) and (max-width:500px){.stage canvas{aspect-ratio:700/760}.subtitle{display:none}}
@media(orientation:landscape) and (max-height:550px){.stage{max-width:min(76vh,480px);margin:auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

/* Embedded as the Slime tab inside Liquid Lab, never a second game page. */
html.embedded,html.embedded body{background:transparent}
html.embedded main{max-width:710px;padding:0;margin:0 auto}
html.embedded header,html.embedded h1,html.embedded .subtitle,html.embedded .footer,html.embedded #status{display:none}
html.embedded .stage{box-shadow:none;border-radius:15px}
html.embedded .stage canvas{aspect-ratio:700/770}
html.embedded .controls{margin-top:9px}
@media(max-width:500px){html.embedded .stage canvas{aspect-ratio:700/840}html.embedded .palette-panel{margin-top:8px}}
</style>
</head>
<body>
<main>
<header><a href="./" class="back"><i>←</i><span>LIQUID LAB</span></a><span class="marker">✌️ MOBILE-ONLY</span></header>
<h1>Slime <span>Mode.</span> 🟢</h1>

<section class="stage">
 <canvas id="slime" aria-label="Slime simulation with two-finger stretch."></canvas>
 <div class="tip"><span id="status">● SOFT BODY LIVE</span><span id="grabs">✋ TOUCH TO GRAB</span></div>
 <span class="stage-hint" id="hint">☝️ Drag to move · ✌️ Stretch</span>
 <div class="desktop-only" id="desktop"><div style="font-size:46px">📱</div><h2>Touchscreen only!</h2><p>Slime Mode is made for phones and tablets with two-finger controls.</p><a href="./">Back to Liquid Lab</a></div>
</section>
<div class="controls"><button class="action" id="squish">💥 Squish</button><button class="action secondary" id="reset">↺ New blob</button><button class="action active" id="effects" aria-pressed="true">✨ FX ON</button></div>
<section class="palette-panel"><strong>🎨 Color</strong><div class="palette">
<button class="swatch active" data-color="mint" aria-label="Mint" style="--color:#81f1b3"><i></i></button>
<button class="swatch" data-color="pink" aria-label="Pink" style="--color:#ff9bc9"><i></i></button>
<button class="swatch" data-color="violet" aria-label="Violet" style="--color:#ac9bff"><i></i></button>
<button class="swatch" data-color="blue" aria-label="Blue" style="--color:#82cfff"><i></i></button>
<button class="swatch" data-color="rainbow" aria-label="Rainbow" style="--color:#caf6d0"><i></i></button>
</div></section>
<details class="panel" id="tuning"><summary><span>⚙️ Physics <small>· Stretch, thickness, gravity</small></span><span class="chevron">⌄</span></summary><div class="panel-body">
<div class="range"><div class="label"><label for="elastic">Stretchiness</label><output id="elastic-val">70%</output></div><input id="elastic" type="range" min="10" max="100" value="70"></div>
<div class="range"><div class="label"><label for="viscous">Thickness</label><output id="viscous-val">70%</output></div><input id="viscous" type="range" min="5" max="100" value="70"></div>
<div class="range"><div class="label"><label for="gravity">Gravity</label><output id="gravity-val">25%</output></div><input id="gravity" type="range" min="0" max="100" value="25"></div>
</div></details>

</main>
<script>
(()=>{
"use strict";
const embedded=/(?:^|[?&])embed=1(?:&|$)/.test(window.location.search);
if(!embedded){window.location.replace("./#slime");return}
document.documentElement.classList.add("embedded");
const $=s=>document.querySelector(s), canvas=$("#slime"),g=canvas.getContext("2d",{alpha:false});
const W=700,H=770,N=64,TAU=Math.PI*2,FLOOR=H-57,BASE_X=132,BASE_Y=95;
const palette={mint:[129,241,179],pink:[255,155,201],violet:[172,155,255],blue:[130,207,255]};
let color="mint",stretch=.7,thickness=.7,gravity=.25,nodes=[],anchors=new Map(),lastTime=0,dtAccum=0,fx=true,phase=0;
let centerState={x:W/2,y:H*.59,vx:0,vy:0},shape={rx:BASE_X,ry:BASE_Y,angle:0,vrx:0,vry:0,va:0};
const offsets=new Float32Array(N),offsetVelocity=new Float32Array(N);
let dualOffset={x:0,y:0},ripples=[],sparkles=[];
const bubbles=Array.from({length:11},(_,i)=>({phi:i*2.39,dist:.14+.68*(i+.5)/11,rad:3+(i%4)*2}));
const mobile=(navigator.maxTouchPoints>=2)||(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches);
if(!mobile){$("#desktop").style.display="flex";$("#status").textContent="MOBILE ONLY"}
function resize(){
 const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.75);
 canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
}
resize();
addEventListener("resize",resize);
function reset(){
 anchors.clear();
 centerState={x:W/2,y:H*.60,vx:0,vy:0};
 shape={rx:BASE_X,ry:BASE_Y,angle:0,vrx:0,vry:0,va:0};
 offsets.fill(0);offsetVelocity.fill(0);
 ripples=[];sparkles=[];nodes=[];
 for(let i=0;i<N;i++)nodes.push({x:0,y:0});
 updateSkin();
 $("#grabs").textContent="✋ TOUCH TO GRAB";
 $("#hint").textContent="☝️ Drag to move · ✌️ Stretch";
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function updateSkin(){
 const ca=Math.cos(shape.angle),sa=Math.sin(shape.angle);
 for(let i=0;i<N;i++){
  const a=i*TAU/N;
  const radius=1+clamp(offsets[i],-.12,.12)+.014*Math.sin(4*a+phase*1.3)+.008*Math.sin(7*a-phase);
  const xx=Math.cos(a)*shape.rx*radius,yy=Math.sin(a)*shape.ry*radius;
  nodes[i].x=centerState.x+xx*ca-yy*sa;
  nodes[i].y=centerState.y+xx*sa+yy*ca;
 }
}
function area(){
 let result=0;
 for(let i=0;i<N;i++){const a=nodes[i],b=nodes[(i+1)%N];result+=a.x*b.y-b.x*a.y}
 return .5*result;
}
function burst(x,y,n=12){
 if(!fx)return;
 ripples.push({x,y,r:13,life:1});
 if(ripples.length>10)ripples.shift();
 for(let i=0;i<n;i++){
  const a=Math.random()*TAU,sp=1+Math.random()*4;
  sparkles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.8,life:1,size:1+Math.random()*2.5});
 }
 if(sparkles.length>100)sparkles.splice(0,sparkles.length-100);
}
reset();
function coords(e){
 const r=canvas.getBoundingClientRect();
 return {x:clamp((e.clientX-r.left)/r.width*W,12,W-12),y:clamp((e.clientY-r.top)/r.height*H,12,H-12)};
}
function center(){
 let x=0,y=0;for(const p of nodes){x+=p.x;y+=p.y}
 return{x:x/N,y:y/N};
}
function pointerDown(e){
 if(!mobile||anchors.size>=2)return;
 e.preventDefault();canvas.setPointerCapture(e.pointerId);
 const p=coords(e);
 anchors.set(e.pointerId,{x:p.x,y:p.y,vx:0,vy:0,offsetX:centerState.x-p.x,offsetY:centerState.y-p.y});
 if(anchors.size===2){
  const pair=[...anchors.values()];
  dualOffset={x:centerState.x-(pair[0].x+pair[1].x)*.5,y:centerState.y-(pair[0].y+pair[1].y)*.5};
  $("#grabs").textContent="✌️ STRETCHING";
  $("#hint").textContent="Pull your fingers apart!";
 }else{$("#grabs").textContent="☝️ GRABBED";$("#hint").textContent="Drag your finger to move the slime"}
 burst(p.x,p.y,5);
}
function pointerMove(e){
 const a=anchors.get(e.pointerId);if(!a)return;
 e.preventDefault();const p=coords(e);
 a.vx=clamp(p.x-a.x,-28,28);a.vy=clamp(p.y-a.y,-28,28);
 a.x=p.x;a.y=p.y;
}
function pointerUp(e){
 const a=anchors.get(e.pointerId);if(!a)return;
 anchors.delete(e.pointerId);
 centerState.vx+=a.vx*.17;centerState.vy+=a.vy*.17;
 for(const q of anchors.values()){q.offsetX=centerState.x-q.x;q.offsetY=centerState.y-q.y}
 for(let i=0;i<N;i++)offsetVelocity[i]+=.021*Math.sin(i*.43+phase*5);
 burst(a.x,a.y,12);
 $("#grabs").textContent=anchors.size?"☝️ GRABBED":"✋ TOUCH TO GRAB";
 $("#hint").textContent=anchors.size?"Drag to move":"☝️ Drag to move · ✌️ Stretch";
}
canvas.addEventListener("pointerdown",pointerDown);
canvas.addEventListener("pointermove",pointerMove);
canvas.addEventListener("pointerup",pointerUp);
canvas.addEventListener("pointercancel",pointerUp);
canvas.addEventListener("lostpointercapture",pointerUp);
function step(){
 phase+=1/60;
 const held=[...anchors.values()],two=held.length>=2;
 let rx=BASE_X,ry=BASE_Y,angle=0,tx=centerState.x,ty=centerState.y;
 if(two){
  const a=held[0],b=held[1],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  rx=clamp(d*.53+17,84,290);
  ry=clamp(BASE_X*BASE_Y/rx,50,170);
  angle=Math.atan2(dy,dx);
  tx=(a.x+b.x)/2+dualOffset.x;ty=(a.y+b.y)/2+dualOffset.y;
 }else if(held.length===1){
  const a=held[0];tx=a.x+a.offsetX;ty=a.y+a.offsetY;
 }
 const stiff=.07+stretch*.04,damp=.82-thickness*.15;
 shape.vrx=(shape.vrx+(rx-shape.rx)*stiff)*damp;
 shape.vry=(shape.vry+(ry-shape.ry)*stiff)*damp;
 shape.rx=clamp(shape.rx+shape.vrx,69,305);
 shape.ry=clamp(shape.ry+shape.vry,46,185);
 const angleDelta=Math.atan2(Math.sin(angle-shape.angle),Math.cos(angle-shape.angle));
 shape.va=(shape.va+angleDelta*.075)*damp;shape.angle+=shape.va;
 if(held.length){
  centerState.vx=(centerState.vx+(tx-centerState.x)*.23)*.72;
  centerState.vy=(centerState.vy+(ty-centerState.y)*.23)*.72;
 }else{
  centerState.vx*=.968-thickness*.008;
  centerState.vy=centerState.vy*(.976-thickness*.012)+.045+gravity*.32;
 }
 centerState.x+=clamp(centerState.vx,-28,28);
 centerState.y+=clamp(centerState.vy,-28,28);
 // Star-convex ordered radial perimeter prevents self-crossing and collapse.
 const extentX=Math.hypot(shape.rx*Math.cos(shape.angle),shape.ry*Math.sin(shape.angle))*1.11;
 const extentY=Math.hypot(shape.rx*Math.sin(shape.angle),shape.ry*Math.cos(shape.angle))*1.11;
 if(centerState.x<extentX+12){centerState.x=extentX+12;centerState.vx=Math.abs(centerState.vx)*.26}
 if(centerState.x>W-extentX-12){centerState.x=W-extentX-12;centerState.vx=-Math.abs(centerState.vx)*.26}
 if(centerState.y<extentY+16){centerState.y=extentY+16;centerState.vy=Math.abs(centerState.vy)*.22}
 if(centerState.y>FLOOR-extentY){
  centerState.y=FLOOR-extentY;
  if(centerState.vy>0)centerState.vy=-centerState.vy*(.12+stretch*.11);
 }
 for(let i=0;i<N;i++){
  const smooth=offsets[(i+N-1)%N]+offsets[(i+1)%N]-2*offsets[i];
  offsetVelocity[i]+=.15*smooth-offsets[i]*(.065+stretch*.025);
  offsetVelocity[i]*=.86-thickness*.12;
  offsets[i]=clamp(offsets[i]+offsetVelocity[i],-.12,.12);
 }
 updateSkin();
 for(let i=ripples.length-1;i>=0;i--){const p=ripples[i];p.r+=2.9;p.life-=.032;if(p.life<=0)ripples.splice(i,1)}
 for(let i=sparkles.length-1;i>=0;i--){const p=sparkles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.life-=.023;if(p.life<=0)sparkles.splice(i,1)}
}
const backgroundLayer=document.createElement("canvas");
backgroundLayer.width=W;backgroundLayer.height=H;
const bg=backgroundLayer.getContext("2d");
function paintBackground(){
 const grad=bg.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,"#1b3935");grad.addColorStop(1,"#132729");
 bg.fillStyle=grad;bg.fillRect(0,0,W,H);
 bg.strokeStyle="#e5fff40a";bg.lineWidth=1;bg.beginPath();
 for(let x=0;x<=W;x+=45){bg.moveTo(x,0);bg.lineTo(x,H)}
 for(let y=0;y<=H;y+=45){bg.moveTo(0,y);bg.lineTo(W,y)}
 bg.stroke();
 const glow=bg.createRadialGradient(W*.5,H*.5,30,W*.5,H*.5,330);
 glow.addColorStop(0,"#83f3ab17");glow.addColorStop(1,"#83f3ab00");
 bg.fillStyle=glow;bg.fillRect(0,0,W,H);
 bg.fillStyle="#213736";bg.fillRect(0,FLOOR+5,W,H-FLOOR);
 bg.beginPath();bg.moveTo(0,FLOOR+4);bg.lineTo(W,FLOOR+4);
 bg.strokeStyle="#b5ffd42f";bg.lineWidth=2;bg.stroke();
}
paintBackground();
function background(){g.drawImage(backgroundLayer,0,0,W,H)}
function slimePath(){
 const last=nodes[N-1],first=nodes[0];
 g.beginPath();g.moveTo((last.x+first.x)*.5,(last.y+first.y)*.5);
 for(let i=0;i<N;i++){
  const p=nodes[i],q=nodes[(i+1)%N];
  g.quadraticCurveTo(p.x,p.y,(p.x+q.x)*.5,(p.y+q.y)*.5);
 }
 g.closePath();
}
function draw(){
 g.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
 background();
 const c=centerState,rgb=palette[color]||[175,236,213];
 if(fx){
  for(let i=0;i<15;i++){
   const x=25+(i*121+phase*(i%2?8:-4)+W*10)%(W-50);
   const y=40+(i*83+Math.sin(phase*.7+i)*15)%(FLOOR-80);
   g.fillStyle="rgba(222,255,231,"+(.12+.12*Math.sin(phase*1.4+i))+")";
   g.beginPath();g.arc(x,y,i%3?1.3:2.1,0,TAU);g.fill();
  }
 }
 g.save();g.shadowColor="#001613";g.shadowBlur=21;g.fillStyle="#001b1950";
 g.beginPath();g.ellipse(c.x,FLOOR+8,shape.rx*.9+28,16,0,0,TAU);g.fill();g.restore();
 g.save();slimePath();
 if(fx){g.shadowColor="rgba("+rgb.join(",")+",.45)";g.shadowBlur=20}
 let grad;
 if(color==="rainbow"){
  grad=g.createLinearGradient(c.x-shape.rx,c.y-shape.ry,c.x+shape.rx,c.y+shape.ry);
  for(let i=0;i<=5;i++)grad.addColorStop(i/5,"hsl("+((phase*38+i*70)%360)+",94%,77%)");
 }else{
  grad=g.createRadialGradient(c.x-shape.rx*.34,c.y-shape.ry*.45,5,c.x,c.y,Math.max(shape.rx,shape.ry)*1.28);
  grad.addColorStop(0,"rgba("+Math.min(255,rgb[0]+42)+","+Math.min(255,rgb[1]+13)+","+Math.min(255,rgb[2]+33)+",.99)");
  grad.addColorStop(.55,"rgb("+rgb.join(",")+")");
  grad.addColorStop(1,"rgb("+Math.round(rgb[0]*.67)+","+Math.round(rgb[1]*.77)+","+Math.round(rgb[2]*.75)+")");
 }
 g.fillStyle=grad;g.fill();g.shadowBlur=0;
 g.lineWidth=3.5;g.strokeStyle="#edfff4a6";g.stroke();g.clip();
 if(fx){
  const ca=Math.cos(shape.angle),sa=Math.sin(shape.angle);
  for(const b of bubbles){
   const a=b.phi+Math.sin(phase*.45+b.phi)*.08;
   const dx=Math.cos(a)*shape.rx*b.dist,dy=Math.sin(a)*shape.ry*b.dist;
   const x=c.x+dx*ca-dy*sa,y=c.y+dx*sa+dy*ca;
   g.fillStyle="#f7ffff2c";g.beginPath();g.arc(x,y,b.rad,0,TAU);g.fill();
   g.strokeStyle="#effff299";g.lineWidth=1;g.beginPath();g.arc(x,y,b.rad,Math.PI*1.08,Math.PI*1.84);g.stroke();
  }
  const highlight=g.createRadialGradient(c.x-shape.rx*.43,c.y-shape.ry*.53,3,c.x-shape.rx*.43,c.y-shape.ry*.53,shape.rx*.9);
  highlight.addColorStop(0,"#ffffff6e");highlight.addColorStop(1,"#ffffff00");
  g.fillStyle=highlight;g.fillRect(c.x-shape.rx*1.4,c.y-shape.ry*1.4,shape.rx*2.8,shape.ry*2.8);
  g.save();g.translate(c.x,c.y);g.rotate(shape.angle);
  g.fillStyle="#204b3dc9";g.strokeStyle="#204b3dc9";g.lineWidth=2.5;
  const blinking=Math.sin(phase*1.5)>.997;
  for(const side of [-1,1]){
   const xx=side*24;
   if(blinking){g.beginPath();g.moveTo(xx-5,-7);g.lineTo(xx+5,-7);g.stroke()}
   else{g.beginPath();g.ellipse(xx,-7,3.3,4.7,0,0,TAU);g.fill()}
  }
  g.beginPath();g.arc(0,4,10,.20*Math.PI,.80*Math.PI);g.stroke();
  g.restore();
 }
 g.restore();
 if(fx){
  for(const p of ripples){
   g.strokeStyle="rgba(232,255,235,"+(p.life*.5)+")";g.lineWidth=2;
   g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.stroke();
  }
  for(const p of sparkles){
   g.fillStyle="rgba(246,255,245,"+(p.life*.87)+")";
   const z=p.size;g.beginPath();g.moveTo(p.x,p.y-z*1.6);g.lineTo(p.x+z*.55,p.y);
   g.lineTo(p.x,p.y+z*1.6);g.lineTo(p.x-z*.55,p.y);g.closePath();g.fill();
  }
 }
 const fingers=[...anchors.values()];
 if(fingers.length===2){
  g.save();g.setLineDash([9,8]);g.lineWidth=2;g.strokeStyle="#deffea6a";
  g.beginPath();g.moveTo(fingers[0].x,fingers[0].y);g.lineTo(fingers[1].x,fingers[1].y);g.stroke();g.restore();
 }
 for(const f of fingers){
  g.strokeStyle="#f6fff7c9";g.lineWidth=2;g.beginPath();g.arc(f.x,f.y,17+Math.sin(phase*6)*2,0,TAU);g.stroke();
  g.fillStyle="#fafff3b9";g.beginPath();g.arc(f.x,f.y,4,0,TAU);g.fill();
 }
}
function frame(t){
 if(!running)return;
 let dt=lastTime?Math.min(40,t-lastTime):16.67;lastTime=t;
 dtAccum=Math.min(55,dtAccum+dt);
 let steps=0;
 while(dtAccum>=16.67&&steps<3){step();dtAccum-=16.67;steps++}
 draw();
 requestAnimationFrame(frame);
}
let running=true;
function notifyHeight(){
 if(!embedded)return;
 const element=document.querySelector("main");
 if(!element)return;
 const height=Math.ceil(element.scrollHeight+3);
 window.parent.postMessage({type:"liquid-lab:slime-height",height},window.location.origin);
}
window.addEventListener("message",event=>{
 if(event.origin!==window.location.origin)return;
 const data=event.data;
 if(!data||data.type!=="liquid-lab:slime-active")return;
 if(!data.active){running=false}
 else if(!running){running=true;lastTime=0;requestAnimationFrame(frame)}
});
if(window.ResizeObserver)new ResizeObserver(notifyHeight).observe(document.querySelector("main"));
requestAnimationFrame(notifyHeight);
if(mobile)requestAnimationFrame(frame);
$("#reset").addEventListener("click",()=>{reset();burst(centerState.x,centerState.y,14)});
$("#squish").addEventListener("click",()=>{
 centerState.vy-=7;shape.vrx+=12;shape.vry-=9;
 for(let i=0;i<N;i++)offsetVelocity[i]+=.045*Math.sin(i*.51+phase*7);
 burst(centerState.x,centerState.y,20);
 $("#hint").textContent="BOING! 🫧";
});
$("#effects").addEventListener("click",()=>{
 fx=!fx;$("#effects").textContent=fx?"✨ FX ON":"✨ FX OFF";
 $("#effects").classList.toggle("active",fx);
 $("#effects").setAttribute("aria-pressed",String(fx));
 if(!fx){ripples=[];sparkles=[]}
});
for(const id of ["elastic","viscous","gravity"]){
 $("#"+id).addEventListener("input",e=>{
  const n=Number(e.target.value);
  $("#"+id+"-val").textContent=n+"%";
  if(id==="elastic")stretch=n/100;
  if(id==="viscous")thickness=n/100;
  if(id==="gravity")gravity=n/100;
 });
}
document.querySelectorAll(".swatch").forEach(b=>{
 b.addEventListener("click",()=>{
  color=b.dataset.color;
  document.querySelectorAll(".swatch").forEach(e=>e.classList.toggle("active",e===b));
 });
});
})();
</script>
