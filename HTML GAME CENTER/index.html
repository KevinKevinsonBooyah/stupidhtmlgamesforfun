<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151719">
<link rel="icon" type="image/png" href="../hub-dog-icon.png?v=3">
<link rel="apple-touch-icon" href="../hub-dog-icon.png?v=3">
<title>HTML GAME CENTER</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:#151719;color:#f1f3f3;font-family:system-ui,-apple-system,sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid #a9dcd6;outline-offset:4px}
main{max-width:810px;margin:auto;padding:clamp(15px,4vw,32px)}
header{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid #33383a}
header img{width:47px;height:47px;border-radius:12px;object-fit:cover;display:block;border:1px solid #505456}
header h1{font-size:19px;letter-spacing:-.025em;margin:0;font-weight:800}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.095em;color:#9ba3a6;margin:25px 0 12px}
.game{position:relative;display:flex;align-items:center;gap:17px;background:#222629;border:1px solid #3a4245;border-radius:17px;padding:15px;min-height:112px;overflow:hidden;transition:background .2s,border-color .2s,transform .2s}
.game:hover{background:#2a3033;border-color:#85b0b0;transform:translateY(-2px)}
.art{width:84px;height:79px;flex-shrink:0;border-radius:13px;background:radial-gradient(circle at 42% 40%,#446c72,#29383d 65%);display:grid;place-items:center}
.drop{width:46px;height:52px;border-radius:58% 42% 64% 36%/69% 64% 36% 31%;background:linear-gradient(130deg,#bce4e6,#65a7b0 60%,#3e7f8d);transform:rotate(-35deg);box-shadow:inset 7px 6px 9px #f0ffff60,inset -8px -8px 11px #1b485a70;animation:float 4s ease-in-out infinite}
.info{min-width:0;flex:1}
.info strong{font-size:20px;letter-spacing:-.035em;display:block;margin-bottom:5px}
.info span{font-size:12px;color:#acb9bb;line-height:1.5}
.arrow{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#334244;color:#d4f4f0;font-size:21px}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -5px}}
@media(max-width:480px){main{padding:16px 13px}header{padding-bottom:15px}header img{width:42px;height:42px}header h1{font-size:17px}h2{margin:21px 0 11px}.game{padding:11px;gap:12px;min-height:99px;border-radius:14px}.art{width:67px;height:69px}.drop{width:35px;height:40px}.info strong{font-size:18px}.info span{font-size:11px}.arrow{width:28px;height:28px}}
@media(prefers-reduced-motion:reduce){.drop{animation:none}.game{transition:none}}
</style>
</head>
<body>
<main>
<header><img src="../hub-dog-icon.png?v=3" alt="Dog icon"><h1>HTML GAME CENTER</h1></header>
<h2>Games</h2>
<a class="game" href="../liquid-lab/" aria-label="Open Liquid Lab">
 <div class="art" aria-hidden="true"><div class="drop"></div></div>
 <div class="info"><strong>Liquid Lab</strong><span>Fluid simulator · Slime Mode</span></div>
 <span class="arrow" aria-hidden="true">›</span>
</a>
</main>
</body>
</html>
